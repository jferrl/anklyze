services:
  # Backend API service
  - type: web
    name: anklyze-api
    runtime: go
    plan: free
    rootDir: backend
    buildCommand: go build -o bin/server ./cmd/server
    startCommand: ./bin/server
    envVars:
      - key: PORT
        value: 8080
      - key: GIN_MODE
        value: release
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard with Neon connection string
    healthCheckPath: /health

  # MCP Server (Model Context Protocol for LLM integration)
  - type: web
    name: anklyze-mcp
    runtime: go
    plan: free
    rootDir: backend
    buildCommand: go build -o bin/mcpserver ./cmd/mcpserver
    startCommand: ./bin/mcpserver
    envVars:
      - key: MCP_TRANSPORT
        value: sse
      - key: LOG_LEVEL
        value: info
      - key: LOG_FORMAT
        value: json
      - key: DATABASE_URL
        sync: false  # Optional: Set manually to enable analytics

  # Frontend static site
  - type: web
    name: anklyze
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: anklyze-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

