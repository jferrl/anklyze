services:
  # Backend API service
  - type: web
    name: anklyze-api
    runtime: go
    plan: free
    rootDir: backend
    buildCommand: go build -o bin/server ./cmd/server
    startCommand: ./bin/server
    region: frankfurt
    envVars:
      - key: PORT
        value: 8080
      - key: GIN_MODE
        value: release
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard
      - key: SUPABASE_URL
        value: https://vrrnobbbvvarnidfnegf.supabase.co
      - key: GEMINI_API_KEY
        sync: false  # Set manually in Render dashboard
    healthCheckPath: /health

  # Frontend static site
  - type: web
    name: anklyze
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://api.anklyze.es
      - key: VITE_SUPABASE_URL
        value: https://vrrnobbbvvarnidfnegf.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        sync: false  # Set manually in Render dashboard (sensitive)

