basePath: /
definitions:
  api.AddCaseRequest:
    properties:
      case_id:
        type: string
      case_order:
        type: integer
    required:
    - case_id
    type: object
  api.AddStudyRaterRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  api.CreateChatSessionResponse:
    properties:
      session_id:
        type: string
    type: object
  api.CreateStudyRequest:
    properties:
      description:
        type: string
      title:
        maxLength: 255
        type: string
    required:
    - title
    type: object
  api.ErrorResponse:
    properties:
      code:
        type: string
      details:
        description: Only included in debug mode
        type: string
      message:
        type: string
    type: object
  api.FeedbackRequest:
    properties:
      comment:
        type: string
      rating:
        enum:
        - positive
        - negative
        type: string
    required:
    - rating
    type: object
  api.RaterProgressResponse:
    properties:
      raters:
        items:
          $ref: '#/definitions/domain.RaterProgress'
        type: array
      total:
        type: integer
    type: object
  api.ReorderCasesRequest:
    properties:
      case_ids:
        items:
          type: string
        type: array
    required:
    - case_ids
    type: object
  api.StudyDetailResponse:
    properties:
      case_count:
        description: Denormalized counters for efficient queries
        type: integer
      cases:
        items:
          $ref: '#/definitions/domain.Case'
        type: array
      complete_raters:
        type: integer
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      id:
        type: string
      status:
        $ref: '#/definitions/domain.StudyStatus'
      title:
        type: string
      total_responses:
        type: integer
      unique_raters:
        type: integer
      updated_at:
        type: string
    type: object
  api.StudyListResponse:
    properties:
      limit:
        type: integer
      page:
        type: integer
      studies:
        items:
          $ref: '#/definitions/domain.Study'
        type: array
      total:
        type: integer
    type: object
  api.StudyRatersResponse:
    properties:
      raters:
        items:
          $ref: '#/definitions/domain.StudyRater'
        type: array
      total:
        type: integer
    type: object
  api.StudyReliabilityResponse:
    properties:
      ao_ota_fleiss:
        $ref: '#/definitions/domain.FleissKappaResult'
      bartonicek_fleiss:
        $ref: '#/definitions/domain.FleissKappaResult'
      calculated_at:
        type: string
      complete_raters:
        description: Raters who completed all cases
        type: integer
      danis_weber_fleiss:
        allOf:
        - $ref: '#/definitions/domain.FleissKappaResult'
        description: Fleiss' Kappa per classification system (now calculable with
          multiple subjects!)
      gold_standard_accuracy:
        allOf:
        - $ref: '#/definitions/domain.StudyGoldStandardAccuracy'
        description: Gold standard accuracy (aggregated across all cases)
      lauge_hansen_fleiss:
        $ref: '#/definitions/domain.FleissKappaResult'
      per_case_metrics:
        description: Per-case analysis (helps identify "hard cases")
        items:
          $ref: '#/definitions/domain.PerCaseMetrics'
        type: array
      study_id:
        type: string
      study_title:
        type: string
      total_cases:
        description: Summary counts
        type: integer
      total_responses:
        type: integer
      unique_raters:
        type: integer
    type: object
  api.UpdateStudyRequest:
    properties:
      description:
        type: string
      title:
        type: string
    type: object
  api.UserProfileResponse:
    properties:
      avatar_url:
        type: string
      display_name:
        type: string
      email:
        type: string
      id:
        type: string
      institution:
        type: string
      provider:
        type: string
      role:
        type: string
      specialty:
        type: string
      training_level:
        type: string
      years_experience:
        type: integer
    type: object
  domain.AOOTAClassification:
    properties:
      code:
        $ref: '#/definitions/domain.AOOTACode'
    type: object
  domain.AOOTACode:
    enum:
    - 44-A1
    - 44-A2
    - 44-B1
    - 44-B2
    - 44-B3
    - 44-C1
    - 44-C2
    - 44-C3
    type: string
    x-enum-comments:
      AOOTAA1: Unifocal / Isolated lateral
      AOOTAA2: Bifocal / Lateral and medial
      AOOTAB1: Isolated lateral
      AOOTAB2: Lateral and medial
      AOOTAB3: Lateral, medial and posterior
      AOOTAC1: Simple diaphyseal
      AOOTAC2: Multifragmentary
      AOOTAC3: Proximal (Maisonneuve)
    x-enum-descriptions:
    - Unifocal / Isolated lateral
    - Bifocal / Lateral and medial
    - Isolated lateral
    - Lateral and medial
    - Lateral, medial and posterior
    - Simple diaphyseal
    - Multifragmentary
    - Proximal (Maisonneuve)
    x-enum-varnames:
    - AOOTAA1
    - AOOTAA2
    - AOOTAB1
    - AOOTAB2
    - AOOTAB3
    - AOOTAC1
    - AOOTAC2
    - AOOTAC3
  domain.AnalyticsSummary:
    properties:
      ao_ota_distribution:
        additionalProperties:
          format: int64
          type: integer
        type: object
      avg_processing_time_ms:
        type: number
      classifications_by_language:
        additionalProperties:
          format: int64
          type: integer
        type: object
      danis_weber_distribution:
        additionalProperties:
          format: int64
          type: integer
        type: object
      impossible_count:
        type: integer
      impossible_percentage:
        type: number
      lauge_hansen_distribution:
        additionalProperties:
          format: int64
          type: integer
        type: object
      period:
        $ref: '#/definitions/domain.TimePeriod'
      total_classifications:
        type: integer
    type: object
  domain.BartonicekClassification:
    properties:
      type:
        $ref: '#/definitions/domain.BartonicekType'
    type: object
  domain.BartonicekType:
    enum:
    - Bartonicek 1
    - Bartonicek 2
    - Bartonicek 3
    - Bartonicek 4
    type: string
    x-enum-varnames:
    - BartonicekType1
    - BartonicekType2
    - BartonicekType3
    - BartonicekType4
  domain.Case:
    properties:
      allow_multiple_responses:
        description: |-
          Single Response Control - when false, users can only submit one response
          Note: Default is set in NewCase(), not via GORM tag (GORM omits false values with default tags)
        type: boolean
      case_order:
        type: integer
      closed_at:
        type: string
      created_at:
        type: string
      created_by:
        description: Admin who created the case
        type: string
      deadline:
        description: Optional deadline for responses
        type: string
      description:
        type: string
      has_tac_images:
        description: Auto-computed from images - true if any TAC images exist
        type: boolean
      id:
        type: string
      published_at:
        type: string
      reference_classification:
        description: |-
          Gold Standard / Reference Classification for validation studies
          Stores the "correct" classification to compare user responses against
        type: object
      reference_input:
        description: |-
          Reference input (FractureInput) that produced the gold standard classification
          Used for divergence analysis to compare answer paths
        type: object
      response_count:
        description: Denormalized counters for efficient queries
        type: integer
      show_reference_after_submit:
        type: boolean
      status:
        $ref: '#/definitions/domain.CaseStatus'
      study_id:
        description: Study membership - if set, this case is part of a study for multi-case
          reliability analysis
        type: string
      title:
        description: Case metadata
        type: string
      unique_users:
        type: integer
      updated_at:
        type: string
    type: object
  domain.CaseStatus:
    enum:
    - draft
    - published
    - closed
    type: string
    x-enum-varnames:
    - CaseStatusDraft
    - CaseStatusPublished
    - CaseStatusClosed
  domain.ChatAnalyticsSummary:
    properties:
      abandoned_sessions:
        type: integer
      avg_clarifications_per_session:
        type: number
      avg_confidence:
        type: number
      avg_messages_per_session:
        type: number
      avg_session_duration_ms:
        type: number
      classification_distribution:
        additionalProperties:
          format: int64
          type: integer
        type: object
      completed_sessions:
        type: integer
      completion_rate:
        type: number
      language_distribution:
        additionalProperties:
          format: int64
          type: integer
        type: object
      period:
        $ref: '#/definitions/domain.TimePeriod'
      total_sessions:
        type: integer
    type: object
  domain.ChatFeedback:
    properties:
      clientIP:
        description: Client metadata
        type: string
      comment:
        type: string
      createdAt:
        type: string
      id:
        type: string
      rating:
        allOf:
        - $ref: '#/definitions/domain.FeedbackRating'
        description: Feedback data
      sessionID:
        type: string
    type: object
  domain.ChatFeedbackSummary:
    properties:
      feedback_with_comment:
        type: integer
      negative_count:
        type: integer
      period:
        $ref: '#/definitions/domain.TimePeriod'
      positive_count:
        type: integer
      positive_rate:
        type: number
      total_feedback:
        type: integer
    type: object
  domain.ChatTrendData:
    properties:
      data_points:
        items:
          $ref: '#/definitions/domain.ChatTrendDataPoint'
        type: array
      granularity:
        type: string
      period:
        $ref: '#/definitions/domain.TimePeriod'
    type: object
  domain.ChatTrendDataPoint:
    properties:
      abandoned_count:
        type: integer
      avg_confidence:
        type: number
      completed_count:
        type: integer
      date:
        type: string
      feedback_count:
        type: integer
      positive_feedback:
        type: integer
      session_count:
        type: integer
    type: object
  domain.ClassificationDistribution:
    properties:
      distribution:
        items:
          $ref: '#/definitions/domain.DistributionItem'
        type: array
      period:
        $ref: '#/definitions/domain.TimePeriod'
      system:
        type: string
      total:
        type: integer
    type: object
  domain.ClassificationResult:
    properties:
      ao_ota:
        $ref: '#/definitions/domain.AOOTAClassification'
      bartonicek:
        $ref: '#/definitions/domain.BartonicekClassification'
      danis_weber:
        $ref: '#/definitions/domain.DanisWeberClassification'
      fracture_type:
        description: Key for frontend translation
        type: string
      impossible:
        type: boolean
      impossible_key:
        description: Key for frontend translation
        type: string
      lauge_hansen:
        $ref: '#/definitions/domain.LaugeHansenClassification'
      notes:
        items:
          type: string
        type: array
    type: object
  domain.ConfidenceBucket:
    properties:
      count:
        type: integer
      percentage:
        type: number
      range:
        type: string
    type: object
  domain.ConfidenceDistribution:
    properties:
      distribution:
        items:
          $ref: '#/definitions/domain.ConfidenceBucket'
        type: array
      period:
        $ref: '#/definitions/domain.TimePeriod'
      total:
        type: integer
    type: object
  domain.ConfidenceInterval:
    properties:
      level:
        description: Confidence level (e.g., 0.95 for 95% CI)
        type: number
      lower:
        description: Lower bound
        type: number
      upper:
        description: Upper bound
        type: number
    type: object
  domain.DanisWeberClassification:
    properties:
      type:
        $ref: '#/definitions/domain.DanisWeberType'
    type: object
  domain.DanisWeberType:
    enum:
    - Weber A
    - Weber B
    - Weber C
    type: string
    x-enum-varnames:
    - DanisWeberA
    - DanisWeberB
    - DanisWeberC
  domain.DistributionItem:
    properties:
      count:
        type: integer
      percentage:
        type: number
      value:
        type: string
    type: object
  domain.FeedbackRating:
    enum:
    - positive
    - negative
    type: string
    x-enum-varnames:
    - FeedbackRatingPositive
    - FeedbackRatingNegative
  domain.FibulaTracePattern:
    enum:
    - parasindesmotic_short
    - parasindesmotic_long
    type: string
    x-enum-varnames:
    - FibulaTraceParasindesmoticShort
    - FibulaTraceParasindesmoticLong
  domain.FibularLevel:
    enum:
    - infrasindesmal
    - transindesmal
    - suprasindesmal
    type: string
    x-enum-comments:
      FibularLevelInfrasindesmal: Infrasindesmal
      FibularLevelSuprasindesmal: Suprasindesmal
      FibularLevelTransindesmal: Transindesmal
    x-enum-descriptions:
    - Infrasindesmal
    - Transindesmal
    - Suprasindesmal
    x-enum-varnames:
    - FibularLevelInfrasindesmal
    - FibularLevelTransindesmal
    - FibularLevelSuprasindesmal
  domain.FleissKappaResult:
    properties:
      confidence_interval:
        allOf:
        - $ref: '#/definitions/domain.ConfidenceInterval'
        description: Confidence interval (optional)
      interpretation:
        description: Uses KappaInterpretation()
        type: string
      kappa:
        type: number
      note:
        description: Note explaining any limitations or issues
        type: string
      num_categories:
        description: Number of classification categories
        type: integer
      num_raters:
        description: Number of complete raters
        type: integer
      num_subjects:
        description: Matrix dimensions
        type: integer
    type: object
  domain.FractureInput:
    properties:
      fibula_infrasindesmal_transverse:
        description: 'For bimaleolar lateral+medial: is fibula fracture infrasindesmal
          and transverse?'
        type: boolean
      fibula_trace_pattern:
        allOf:
        - $ref: '#/definitions/domain.FibulaTracePattern'
        description: Fibula trace pattern for suprasyndesmotic fractures (PA vs PER
          differentiation)
      fibular_level:
        allOf:
        - $ref: '#/definitions/domain.FibularLevel'
        description: 'For lateral malleolus: fracture level'
      fibular_level_for_transverse:
        allOf:
        - $ref: '#/definitions/domain.FibularLevel'
        description: 'For bimaleolar lateral+medial with transverse morphology: fibular
          level'
      has_ct_scan:
        description: CT scan availability - determines if Bartonicek can be classified
        type: boolean
      involved_malleoli:
        allOf:
        - $ref: '#/definitions/domain.InvolvedMalleoli'
        description: 'Question 1: Which malleoli are fractured?'
      lateral_morphology:
        allOf:
        - $ref: '#/definitions/domain.LateralMorphology'
        description: 'For lateral malleolus: morphology'
      medial_morphology:
        allOf:
        - $ref: '#/definitions/domain.MedialMorphology'
        description: 'For medial malleolus: morphology'
      posterior_fracture_type:
        allOf:
        - $ref: '#/definitions/domain.PosteriorFractureType'
        description: 'For posterior malleolus: fracture type (Bartonicek)'
      suprasindesmal_type:
        allOf:
        - $ref: '#/definitions/domain.SuprasindesmalType'
        description: 'For suprasindesmal: fracture type'
    type: object
  domain.InvolvedMalleoli:
    enum:
    - posterior_only
    - medial_only
    - lateral_only
    - medial_posterior
    - lateral_posterior
    - lateral_medial
    - trimaleolar
    type: string
    x-enum-comments:
      InvolvedLateralMedial: Maléolos lateral y medial
      InvolvedLateralOnly: Maléolo lateral
      InvolvedLateralPosterior: Maléolos lateral y posterior
      InvolvedMedialOnly: Maléolo medial
      InvolvedMedialPosterior: Maléolos medial y posterior
      InvolvedPosteriorOnly: Maléolo posterior
      InvolvedTrimaleolar: Maléolos medial, lateral y posterior
    x-enum-descriptions:
    - Maléolo posterior
    - Maléolo medial
    - Maléolo lateral
    - Maléolos medial y posterior
    - Maléolos lateral y posterior
    - Maléolos lateral y medial
    - Maléolos medial, lateral y posterior
    x-enum-varnames:
    - InvolvedPosteriorOnly
    - InvolvedMedialOnly
    - InvolvedLateralOnly
    - InvolvedMedialPosterior
    - InvolvedLateralPosterior
    - InvolvedLateralMedial
    - InvolvedTrimaleolar
  domain.LateralMorphology:
    enum:
    - transverse
    - oblique
    - spiral
    type: string
    x-enum-comments:
      LateralMorphologyOblique: Oblicua (Baja medial, alta lateral)
      LateralMorphologySpiral: Espiroidea (Baja anterior, alta posterior)
      LateralMorphologyTransverse: Transversa
    x-enum-descriptions:
    - Transversa
    - Oblicua (Baja medial, alta lateral)
    - Espiroidea (Baja anterior, alta posterior)
    x-enum-varnames:
    - LateralMorphologyTransverse
    - LateralMorphologyOblique
    - LateralMorphologySpiral
  domain.LaugeHansenClassification:
    properties:
      ambiguous:
        description: Whether classification is ambiguous
        type: boolean
      possible_types:
        description: Alternative types when classification is ambiguous
        items:
          type: string
        type: array
      type:
        allOf:
        - $ref: '#/definitions/domain.LaugeHansenType'
        description: SA, SER, PER, PA
    type: object
  domain.LaugeHansenType:
    enum:
    - SA
    - SER
    - PER
    - PA
    type: string
    x-enum-varnames:
    - LaugeHansenSA
    - LaugeHansenSER
    - LaugeHansenPER
    - LaugeHansenPA
  domain.MedialMorphology:
    enum:
    - oblique
    - transverse
    type: string
    x-enum-comments:
      MedialMorphologyOblique: Oblicuo
      MedialMorphologyTransverse: Transverso
    x-enum-descriptions:
    - Oblicuo
    - Transverso
    x-enum-varnames:
    - MedialMorphologyOblique
    - MedialMorphologyTransverse
  domain.PerCaseMetrics:
    properties:
      ao_ota_agreement:
        type: number
      bartonicek_agreement:
        description: Optional, requires CT
        type: number
      case_id:
        type: string
      case_order:
        type: integer
      case_title:
        type: string
      danis_weber_agreement:
        description: Per-system agreement (percentage)
        type: number
      gold_standard_match_rate:
        description: Gold standard match rate (if reference set for this case)
        type: number
      is_low_agreement:
        description: Identifies cases with low agreement (potential "hard cases")
        type: boolean
      lauge_hansen_agreement:
        type: number
      response_count:
        type: integer
    type: object
  domain.PosteriorFractureType:
    enum:
    - extraincisural
    - posterolateral
    - posteromedial_posterolateral
    - large_posterolateral
    type: string
    x-enum-comments:
      PosteriorExtraincisural: Fragmento extraincisural (Bartonicek 1)
      PosteriorLargePosterolateral: Gran fragmento triangular posterolateral (Bartonicek
        4)
      PosteriorPosterolateral: Fragmento posterolateral (Bartonicek 2)
      PosteriorPosteromedialPosterolateral: Fragmento posteromedial y posterolateral
        (Bartonicek 3)
    x-enum-descriptions:
    - Fragmento extraincisural (Bartonicek 1)
    - Fragmento posterolateral (Bartonicek 2)
    - Fragmento posteromedial y posterolateral (Bartonicek 3)
    - Gran fragmento triangular posterolateral (Bartonicek 4)
    x-enum-varnames:
    - PosteriorExtraincisural
    - PosteriorPosterolateral
    - PosteriorPosteromedialPosterolateral
    - PosteriorLargePosterolateral
  domain.RaterProgress:
    properties:
      cases_completed:
        type: integer
      display_name:
        type: string
      is_complete:
        type: boolean
      last_response_at:
        type: string
      total_cases:
        type: integer
      user_email:
        type: string
      user_id:
        type: string
    type: object
  domain.Study:
    properties:
      case_count:
        description: Denormalized counters for efficient queries
        type: integer
      complete_raters:
        type: integer
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      id:
        type: string
      status:
        $ref: '#/definitions/domain.StudyStatus'
      title:
        type: string
      total_responses:
        type: integer
      unique_raters:
        type: integer
      updated_at:
        type: string
    type: object
  domain.StudyGoldStandardAccuracy:
    properties:
      ao_ota_accuracy:
        type: number
      bartonicek_accuracy:
        type: number
      cases_with_reference:
        type: integer
      danis_weber_accuracy:
        description: Per-system accuracy (averaged across cases)
        type: number
      lauge_hansen_accuracy:
        type: number
      overall_accuracy:
        type: number
      total_comparisons:
        type: integer
    type: object
  domain.StudyRater:
    properties:
      cases_completed:
        type: integer
      created_at:
        type: string
      id:
        type: string
      last_response_at:
        type: string
      study_id:
        type: string
      user_email:
        type: string
      user_id:
        type: string
    type: object
  domain.StudyStatus:
    enum:
    - draft
    - active
    - closed
    type: string
    x-enum-varnames:
    - StudyStatusDraft
    - StudyStatusActive
    - StudyStatusClosed
  domain.SuprasindesmalType:
    enum:
    - simple_diaphyseal
    - multifragmentary
    - proximal
    type: string
    x-enum-comments:
      SuprasindesmalMultifragmentary: Multifragmentaria
      SuprasindesmalProximal: Proximal
      SuprasindesmalSimpleDiaphyseal: Diafisaria Simple
    x-enum-descriptions:
    - Diafisaria Simple
    - Multifragmentaria
    - Proximal
    x-enum-varnames:
    - SuprasindesmalSimpleDiaphyseal
    - SuprasindesmalMultifragmentary
    - SuprasindesmalProximal
  domain.TimePeriod:
    properties:
      from:
        type: string
      to:
        type: string
    type: object
  domain.TrendData:
    properties:
      data_points:
        items:
          $ref: '#/definitions/domain.TrendDataPoint'
        type: array
      granularity:
        type: string
      period:
        $ref: '#/definitions/domain.TimePeriod'
    type: object
  domain.TrendDataPoint:
    properties:
      count:
        type: integer
      date:
        type: string
      impossible_count:
        type: integer
    type: object
  llm.Clarification:
    properties:
      field:
        type: string
      options:
        items:
          type: string
        type: array
      question:
        type: string
    type: object
  service.ChatRequest:
    properties:
      language:
        type: string
      message:
        type: string
      session_id:
        type: string
    type: object
  service.ChatResponse:
    properties:
      clarifications:
        items:
          $ref: '#/definitions/llm.Clarification'
        type: array
      classification:
        $ref: '#/definitions/domain.ClassificationResult'
      confidence:
        type: number
      extracted_input:
        $ref: '#/definitions/domain.FractureInput'
      message:
        type: string
      missing_fields:
        items:
          type: string
        type: array
      status:
        $ref: '#/definitions/service.ChatStatus'
    type: object
  service.ChatStatus:
    enum:
    - complete
    - needs_clarification
    - error
    type: string
    x-enum-varnames:
    - ChatStatusComplete
    - ChatStatusNeedsClarification
    - ChatStatusError
host: api.anklyze.es
info:
  contact:
    name: API Support
    url: https://github.com/jferrl/anklyze
  description: Ankle fracture classification API. Classifies fractures according to
    Danis-Weber, Lauge-Hansen, AO/OTA, and Bartonicek systems.
  license:
    name: Apache 2.0
    url: https://opensource.org/licenses/MIT
  title: Anklyze API
  version: "1.0"
paths:
  /api/admin/studies:
    get:
      parameters:
      - description: Filter by status (draft, active, closed)
        in: query
        name: status
        type: string
      - default: 1
        description: Page number
        in: query
