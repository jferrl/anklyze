name: E2E Tests

on:
  workflow_dispatch:

jobs:
  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-24.04 # Playwright 1.x does not support ubuntu-latest (26.04) yet
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anklyze
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d anklyze"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install backend dependencies
        run: go mod download

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install E2E dependencies
        run: cd e2e && npm ci

      - name: Install Playwright browsers
        run: cd e2e && npx playwright install --with-deps chromium

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Start backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/anklyze?sslmode=disable
        run: go run ./cmd/anklyze-apiserver &

      - name: Wait for backend
        run: |
          for i in {1..60}; do
            curl -s http://localhost:8080/health && break
            sleep 2
          done

      - name: Start frontend preview
        run: cd frontend && npm run preview -- --port 5173 &

      - name: Wait for frontend
        run: |
          for i in {1..60}; do
            curl -s http://localhost:5173 && break
            sleep 2
          done

      - name: Run E2E tests
        run: cd e2e && npx playwright test --project=chromium --workers=4

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

      - name: Upload test screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-screenshots
          path: e2e/test-results/
          retention-days: 7
