name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install backend dependencies
        run: cd backend && go mod download

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install E2E dependencies
        run: cd e2e && npm ci

      - name: Install Playwright browsers
        run: cd e2e && npx playwright install --with-deps chromium

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Start backend
        run: cd backend && go run cmd/server/main.go &

      - name: Wait for backend
        run: |
          for i in {1..60}; do
            curl -s http://localhost:8080/health && break
            sleep 2
          done

      - name: Start frontend preview
        run: cd frontend && npm run preview -- --port 5173 &

      - name: Wait for frontend
        run: |
          for i in {1..60}; do
            curl -s http://localhost:5173 && break
            sleep 2
          done

      - name: Run E2E tests
        run: cd e2e && npx playwright test --project=chromium --workers=4

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

      - name: Upload test screenshots
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-screenshots
          path: e2e/test-results/
          retention-days: 7
