name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "migrations/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/backend.yml"
  # No path filter on pull requests: the check is required, so the job always reports.
  # The changes job skips the build (a skipped job counts as passing) when nothing relevant changed.
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            relevant:
              - 'cmd/**'
              - 'internal/**'
              - 'migrations/**'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - '.github/workflows/backend.yml'

  build:
    name: Build and Test
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Check gofmt
        run: test -z "$(gofmt -l .)" || { echo "Files need formatting:"; gofmt -l .; exit 1; }

      - name: Run staticcheck (U1000 - unused code)
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 -checks U1000 ./...

      - name: Run deadcode
        # deadcode always exits 0, so fail on any output.
        run: |
          out=$(go run golang.org/x/tools/cmd/deadcode@v0.49.0 ./...)
          [ -z "$out" ] || { echo "$out"; exit 1; }

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Run tests
        run: go test -v -race ./...

      - name: Build
        run: go build -o bin/server ./cmd/anklyze-apiserver
