server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — always serve index.html for client-side routes.
    # no-cache ensures the browser revalidates on every request,
    # so new deployments are picked up immediately without a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Hashed assets (JS, CSS, images) — immutable, cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /chunks/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /entries/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
