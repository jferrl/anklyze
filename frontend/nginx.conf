server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — always serve index.html for client-side routes.
    # no-cache ensures the browser revalidates on every request,
    # so new deployments are picked up immediately without a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Hashed assets (JS, CSS, images) — immutable, cache forever.
    # Return 404 (not index.html) for missing files so stale imports
    # get a clean error instead of an HTML page with the wrong MIME type.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /chunks/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /entries/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
